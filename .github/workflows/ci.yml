name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Superseding an in-flight run is right for a PR branch, where only the tip
  # matters. On main it is not: during a merge queue each new merge cancelled
  # the previous run, so several commits landed without ever getting a verdict.
  #
  # That was first addressed with cancel-in-progress alone, and it did not
  # hold — a batch of 12 rapid merges on 2026-07-29 cancelled 10 consecutive
  # push runs on main, each killed within ~11s having dispatched zero jobs,
  # which is the signature of a concurrency supersede rather than a failure.
  #
  # So the guarantee is moved into the group key instead of relying on
  # cancel-in-progress evaluating the way it reads. Including the SHA for
  # push events puts every main commit in a group of its own, where there is
  # nothing to supersede it — true regardless of how the boolean below is
  # coerced. Pull request events keep a per-ref group, so pushing a new commit
  # to a PR still supersedes its own previous run.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          # Editable install is not needed for the tests (pytest picks up src/
          # via pythonpath in pyproject.toml) but it does verify the packaging
          # metadata still builds, which nothing else in CI would catch.
          pip install -e . --no-deps

      # Coverage runs on every matrix entry rather than once, so the floor is
      # enforced under each supported interpreter. Version-dependent branches
      # (the __future__ annotation paths, say) are exercised differently on
      # 3.9 than on 3.12, and a single-version run would not see that.
      - name: Run tests with coverage
        run: pytest tests/ -q --cov

      - name: Lint with ruff
        run: ruff check .

  # Its own job rather than a step in the matrix. Type-checking the same
  # source three times answers the same question three times, and running it
  # under several interpreters is actively harmful here: mypy resolves the
  # installed dependency stubs, so the 3.12 job was reading numpy stubs
  # written in PEP 695 syntax while targeting an older Python and failing to
  # parse them. One interpreter, one answer.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Blocking from the start, which is only reasonable because the package
      # already passes cleanly — see the PR that added this. Introducing it
      # non-blocking would have meant a warning nobody reads.
      - name: Type-check with mypy
        run: mypy
