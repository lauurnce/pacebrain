name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseding an in-flight run is right for a PR branch, where only the tip
  # matters. On main it is not: during a merge queue each new merge cancelled
  # the previous run, so several commits landed without ever getting a verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          # Editable install is not needed for the tests (pytest picks up src/
          # via pythonpath in pyproject.toml) but it does verify the packaging
          # metadata still builds, which nothing else in CI would catch.
          pip install -e . --no-deps

      - name: Run tests
        run: pytest tests/ -q

      - name: Lint with ruff
        run: ruff check .
