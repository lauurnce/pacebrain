[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pacebrain"
version = "0.1.0"
description = "ML models for predicting runner race finish times and pacing strategy"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "lauurnce" }]

# Kept in sync with requirements.txt, which stays as the pip-install entry
# point for people following the README setup steps.
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pre-commit>=3.5.0",
    "mypy>=1.11.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pacebrain*"]

[tool.pytest.ini_options]
# Puts src/ on sys.path for the test session, which is what the
# sys.path.insert boilerplate at the top of every test module was doing by
# hand. With this set, the tests import pacebrain like any installed package
# and no longer need the bootstrap.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/pacebrain"]
# Branch coverage as well as line: a partially-tested `if` reports as fully
# covered otherwise, which is exactly the case worth knowing about in the
# format-sniffing and validation code.
branch = true

[tool.coverage.report]
show_missing = true
# The floor is set just below where the package actually sits, so it catches
# a real regression without failing the build for rounding. Raise it as
# coverage improves — the point of a ratchet is that it only goes one way.
#
# 55 was set when the package was at 88% and the three training modules were
# the whole gap. They are now covered, along with eval.py's orchestrator and
# train.py's main(), and the package sits at 99.14%. A 44-point gap between
# floor and actual is not a ratchet, it is a floor nothing can ever hit:
# coverage could have halved without CI noticing.
#
# 97 leaves roughly 24 statements of headroom on 813. That is enough that
# adding a genuinely awkward branch does not block a PR, and tight enough
# that deleting a test file does.
fail_under = 97
exclude_lines = [
    "pragma: no cover",
    # Several modules double as runnable scripts (python src/pacebrain/eval.py)
    # because the PROGRESS.md workflow depends on it. Those blocks never run
    # under import, so counting them would penalise the design rather than
    # measure the tests.
    "if __name__ == .__main__.:",
]

[tool.mypy]
# python_version is deliberately NOT pinned. Setting it to "3.9" made the
# 3.12 CI job fail: modern mypy rejects a target below 3.10 outright, and
# with the target below 3.12 it cannot parse numpy's own stubs, which use
# PEP 695 `type` syntax ("Type statement is only supported in Python 3.12
# and greater"). Unset, mypy targets whichever interpreter runs it.
#
# Runtime 3.9 compatibility is covered where it is actually observable —
# the test matrix imports every module under 3.9, so syntax the version
# cannot parse (`X | None` without a __future__ import, say) fails there.
#
# Scoped to the package, not the whole repo. src/scratch/ is exploratory
# day-by-day code whose whole point is being quick and throwaway, and the
# tests deliberately construct malformed inputs to check they are rejected —
# type-checking either would fight the reason they exist.
files = ["src/pacebrain"]
# torch, pandas, sklearn and matplotlib ship incomplete or absent stubs.
# Without this, mypy reports import errors for the dependencies rather than
# anything about this codebase.
ignore_missing_imports = true

# Every function in the package is annotated, so this is on and blocking —
# the same reasoning as the type-check job itself: introducing it
# non-blocking would mean a warning nobody reads.
#
# It matters more than it looks. Without it mypy skips the *body* of an
# unannotated function entirely, so a single missing signature silently
# turns off checking for everything inside it. The gap it closed here was
# train.py, whose four functions were bare — which is to say the module
# doing the tensor manipulation most likely to have a shape bug was the one
# module mypy was not reading.
disallow_untyped_defs = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E4", # import formatting
    "E7",
    "E9",
    "F",  # pyflakes
    "I",  # import sorting
]

[tool.ruff.lint.per-file-ignores]
# These modules are runnable as standalone scripts (python src/pacebrain/eval.py),
# which the learning-journal workflow in PROGRESS.md depends on. They bootstrap
# sys.path before importing pacebrain, so their imports legitimately sit below
# executable code — sorting or hoisting them would break the bootstrap.
"src/pacebrain/eval.py" = ["E402", "I001"]
"src/pacebrain/predict.py" = ["E402", "I001"]
"src/pacebrain/seq_models.py" = ["E402", "I001"]
"src/pacebrain/train.py" = ["E402", "I001"]
"src/pacebrain/train_finish.py" = ["E402", "I001"]
"src/pacebrain/train_pacing.py" = ["E402", "I001"]
"app/app.py" = ["E402", "I001"]
"src/scratch/riegel_audit.py" = ["E402", "I001"]
