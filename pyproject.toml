[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pacebrain"
version = "0.1.0"
description = "ML models for predicting runner race finish times and pacing strategy"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "lauurnce" }]

# Kept in sync with requirements.txt, which stays as the pip-install entry
# point for people following the README setup steps.
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "pre-commit>=3.5.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pacebrain*"]

[tool.pytest.ini_options]
# Puts src/ on sys.path for the test session, which is what the
# sys.path.insert boilerplate at the top of every test module was doing by
# hand. With this set, the tests import pacebrain like any installed package
# and no longer need the bootstrap.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E4", # import formatting
    "E7",
    "E9",
    "F",  # pyflakes
    "I",  # import sorting
]

[tool.ruff.lint.per-file-ignores]
# These modules are runnable as standalone scripts (python src/pacebrain/eval.py),
# which the learning-journal workflow in PROGRESS.md depends on. They bootstrap
# sys.path before importing pacebrain, so their imports legitimately sit below
# executable code — sorting or hoisting them would break the bootstrap.
"src/pacebrain/eval.py" = ["E402", "I001"]
"src/pacebrain/predict.py" = ["E402", "I001"]
"src/pacebrain/seq_models.py" = ["E402", "I001"]
"src/pacebrain/train.py" = ["E402", "I001"]
"src/pacebrain/train_finish.py" = ["E402", "I001"]
"src/pacebrain/train_pacing.py" = ["E402", "I001"]
"app/app.py" = ["E402", "I001"]
"src/scratch/riegel_audit.py" = ["E402", "I001"]
